[project]
name = "soup-queue"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.8",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short -p no:cacheprovider"
