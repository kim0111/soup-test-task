x-app: &app
  build: .
  image: soup-queue
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:?copy .env.example to .env}:${POSTGRES_PASSWORD:?copy .env.example to .env}@db:5432/${POSTGRES_DB:?copy .env.example to .env}
    # Deliberate bug (SPEC §8.4) for api, workers and chaos; empty = correct code.
    MUTATION: ${MUTATION:-}
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
    # Backstop: a session idle inside a transaction is killed after 2 s, so it can't pin row locks.
    command: ["postgres", "-c", "idle_in_transaction_session_timeout=2s"]
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro
    # Throwaway data dir: every fresh container starts from 001_init.sql.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      # $$ = resolved inside the container from its own env, not by compose.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 1s
      timeout: 3s
      retries: 30

  api:
    <<: *app
    ports:
      - "8000:8000"

  workers:
    <<: *app
    command: ["python", "-m", "app.worker"]
    deploy:
      replicas: 4

  tests:
    <<: *app
    profiles: [test]
    command: ["pytest"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?copy .env.example to .env}:${POSTGRES_PASSWORD:?copy .env.example to .env}@db:5432/${POSTGRES_DB:?copy .env.example to .env}
      MUTATION: ${MUTATION:-}
      PYTHONDONTWRITEBYTECODE: "1"
    # Live code, no rebuild per change. Tests use their own database (see tests/conftest.py).
    volumes:
      - ./app:/app/app:ro
      - ./tests:/app/tests:ro
      - ./migrations:/app/migrations:ro
      - ./chaos:/app/chaos:ro
      - ./loadtest:/app/loadtest:ro

  chaos:
    <<: *app
    profiles: [chaos]
    entrypoint: ["python", "-m", "chaos.harness"]
    # Live code (the harness runs its own API and workers from it); .git only to record the commit.
    volumes:
      - ./app:/app/app:ro
      - ./chaos:/app/chaos:ro
      - ./.git:/app/.git:ro
      - ./results:/app/results

  load:
    <<: *app
    profiles: [load]
    entrypoint: ["python", "-m", "loadtest.load"]
    # Load hits the compose `api`; workers are spawned (and kill -9'd) by the load test itself,
    # since compose workers have no restart policy. `app/` is NOT mounted: load, its workers and
    # `api` all run the image's code, so the code hash in the header is what the API serves
    # (`docker compose up -d --build db api` first). chaos/ for the invariants, .git for the commit.
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - ./loadtest:/app/loadtest:ro
      - ./chaos:/app/chaos:ro
      - ./.git:/app/.git:ro
      - ./results:/app/results
